<html>

<head>
    <title>CSS Display Property Example</title>
    <style>
        p {
            color: white;
        }

        .pink {
            display: inline-block;
            width: 200px;
            height: 200px;
            background-color: pink;
        }

        .purple {
            display: inline-block;
            width: 200px;
            height: 200px;
            background-color: purple;
        }

        .black {
            display: inline-block;
            width: 200px;
            height: 200px;
            background-color: black;
        }
    </style>
</head>


<body>
    <h1>CSS Display Property</h1>
    <p class="merah muda">merah muda </p>
    <p class="ungu">ungu </p>
    <p class="hitam">hitam</p>
</body>


</html>
